<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Work through a past test with instant marking.">
  <title>Exam Drill</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/quiz.css">
  <link rel="stylesheet" href="assets/css/results.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

  <script>
    try {
      const saved = localStorage.getItem('exam-drill:theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (_) {}
  </script>
</head>
<body>
  <header class="appbar quizbar">
    <div class="appbar-inner">
      <a class="icon-btn" href="index.html" title="Back to courses" aria-label="Back to courses">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M11 18l-6-6 6-6"/>
        </svg>
      </a>

      <span class="title">
        <b id="bar-title">Exam Drill</b>
        <span id="bar-sub"></span>
      </span>

      <span class="spacer"></span>
      <span class="counter" id="counter"></span>
      <div id="bar-actions"></div>
    </div>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
  </header>

  <main class="wrap wrap-narrow page" id="app">
    <div class="state">
      <div class="spinner"></div>
      <p>Loading…</p>
    </div>
  </main>

  <script type="module" src="assets/js/quiz/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Practice</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .container { max-width: 940px; }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1rem;
    }

    .course-box {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem 1.2rem 1.25rem;
      transition: border-color 0.15s, transform 0.15s;
    }
    .course-box:not(.empty):hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .course-box-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .course-code {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .course-tag {
      flex-shrink: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.12rem 0.55rem;
    }

    .course-box-title {
      font-size: 1.02rem;
      line-height: 1.35;
      color: var(--text);
    }

    .course-tests {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.15rem;
    }

    .course-test {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.88rem;
      color: var(--text);
      transition: border-color 0.12s, background 0.12s, transform 0.12s;
    }
    .course-test:hover {
      border-color: var(--accent);
      background: var(--surface-2);
      transform: translateX(2px);
    }
    .course-test .go { color: var(--accent); font-size: 0.9rem; }

    .course-empty {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
    }
    .course-box.empty { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Exam Practice</h1>
      <p class="subtitle">Pick a course, then choose a test</p>
    </header>
    <main>
      <div class="course-grid" id="course-menu"></div>
    </main>
  </div>

  <script>
    async function loadCourses() {
      const res = await fetch('courses/manifest.json');
      const courses = await res.json();
      const menu = document.getElementById('course-menu');

      courses.forEach(course => {
        const tests = course.tests || [];
        const box = document.createElement('div');
        box.className = 'course-box' + (tests.length ? '' : ' empty');

        const dash = course.title.indexOf(' - ');
        const code = dash === -1 ? '' : course.title.slice(0, dash);
        const name = dash === -1 ? course.title : course.title.slice(dash + 3);

        const head = document.createElement('div');
        head.className = 'course-box-head';
        head.innerHTML =
          `<span class="course-code">${code || course.id || ''}</span>` +
          (course.description ? `<span class="course-tag">${course.description}</span>` : '');
        box.appendChild(head);

        const title = document.createElement('div');
        title.className = 'course-box-title';
        title.textContent = name;
        box.appendChild(title);

        if (tests.length) {
          const list = document.createElement('div');
          list.className = 'course-tests';
          tests.forEach(t => {
            const a = document.createElement('a');
            a.className = 'course-test';
            a.href = `quiz.html?file=${encodeURIComponent(t.file)}&title=${encodeURIComponent(t.title)}`;
            a.innerHTML = `<span>${t.title}</span><span class="go">&rarr;</span>`;
            list.appendChild(a);
          });
          box.appendChild(list);
        } else {
          const empty = document.createElement('div');
          empty.className = 'course-empty';
          empty.textContent = 'No tests yet';
          box.appendChild(empty);
        }

        menu.appendChild(box);
      });
    }

    loadCourses();
  </script>
</body>
</html>
